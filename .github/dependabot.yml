version: 2
updates:
  # Root workspace (concurrently, shared tooling)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      dev-dependencies:
        dependency-type: development

  # GitHub Actions workflow updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    labels:
      - ci
