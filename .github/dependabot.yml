version: 2

# Grouping policy
# ---------------
# Each ecosystem groups its minor + patch updates into ONE pull request.
# The previous config grouped only `dependency-type: development`, so every
# production dependency still got its own PR — this repo reached 19 open at
# once, which buries anything that actually matters.
#
# The React runtime pair is grouped at ANY update level, majors included:
# dependabot otherwise raises `react` and `react-dom` separately and each PR
# fails on a peer conflict with the other's pinned version.
#
# Non-React major bumps stay ungrouped — breaking by nature, so they deserve an
# individual PR that can be judged (or closed) on its own.
updates:
  # Root workspace (concurrently, shared tooling)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - backend
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - frontend
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions workflow updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: '06:00'
    open-pull-requests-limit: 2
    labels:
      - ci
    groups:
      actions-all:
        patterns: ["*"]
